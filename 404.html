<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- GitHub Pages serves this file for any missing path, so assets resolve from the project root -->
  <base href="/oncara-nails/">
  <title>Página no encontrada — ONCARA</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo-jaguar.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#151510">
  <style>
    .not-found {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.25rem;
      background: radial-gradient(circle at 50% 35%, var(--bg-dark-accent) 0%, var(--bg-dark) 70%);
    }
    .not-found img { width: 110px; margin-bottom: 1.5rem; }
    .not-found-code {
      font-family: var(--font-caps);
      color: var(--gold);
      letter-spacing: 0.3em;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .not-found h1 {
      font-family: var(--font-heading);
      color: var(--text-cream);
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 0.12em;
      font-weight: 400;
      margin-bottom: 1rem;
    }
    .not-found p {
      font-family: var(--font-serif);
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 460px;
      margin: 0 auto 2rem;
    }
    .not-found-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="not-found">
    <img src="assets/icons/logo-jaguar.svg" alt="ONCARA" width="100" height="40">
    <span class="not-found-code">ERROR 404</span>
    <h1>ESTE CAMINO SE PERDIÓ EN LA SELVA</h1>
    <p>La página que buscás no existe o cambió de lugar. Volvé al inicio o descubrí nuestras colecciones.</p>
    <div class="not-found-actions">
      <a href="index.html" class="btn btn-gold">VOLVER AL INICIO</a>
      <a href="tienda.html" class="btn btn-outline-gold">VER TIENDA</a>
    </div>
  </main>
</body>
</html>
